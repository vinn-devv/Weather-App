<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="weather-app">
      <h1>Weather App</h1>

      <form id="search-form">
        <input
          id="city-input"
          type="text"
          placeholder="Enter a city"
          required
        />
        <button id="search-button" type="submit">Search</button>
        <button type="button" id="location-button">Use My Location</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>

      <section id="weather-result" hidden>
        <h2 id="city-name"></h2>
        <p id="local-time"></p>
        <section id="search-history">
          <h2>Recent Searches</h2>
          <button type="button" id="clear-history-button">Clear History</button>
          <ul id="history-list"></ul>
        </section>
        <p id="temperature"></p>

        <div class="temperature-toggle">
          <button type="button" id="celsius-button" class="active">°C</button>
          <button type="button" id="fahrenheit-button">°F</button>
        </div>
        <p id="feels-like"></p>
        <p id="weather-icon" aria-hidden="true"></p>
        <p id="weather-description"></p>
        <p id="wind-speed"></p>
        <p id="humidity"></p>
        <p id="last-updated"></p>
        <button type="button" id="refresh-button">Refresh Weather</button>
      </section>
    </main>
  </body>
</html>
